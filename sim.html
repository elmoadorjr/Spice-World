<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakhoda — Voyage of the Eastern Seas, 1500 AD</title>
    <link rel="stylesheet" href="vendor/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="vendor/three.min.js"></script>
    <script src="js/data/ports.js"></script>
    
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-gold: #fbbf24;
            --accent-cyan: #22d3ee;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-fire: #ef4444;
            --accent-mana: #3b82f6;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; 
            font-family: 'Outfit', sans-serif; 
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: crosshair; 
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #damage-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(239, 68, 68, 0);
            pointer-events: none;
            z-index: 9999;
            transition: background 0.3s ease-out;
        }
        
        #lightning-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 9998;
            transition: background 0.1s ease-out;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .glass-panel {
            pointer-events: auto; 
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            transition: background 1s ease;
        }

        .hud-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .hud-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
            border-radius: 999px;
            position: relative;
        }

        .hud-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 100%);
            border-radius: 999px;
        }

        .control-btn {
            width: 64px;
            height: 64px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .control-btn:active, .control-btn.active {
            background: rgba(251, 191, 36, 0.2); 
            transform: scale(0.92);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
        }

        .control-btn.btn-fire {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
            color: white;
        }
        
        .control-btn.btn-fire:active, .control-btn.btn-fire.active {
            background: rgba(239, 68, 68, 0.6);
            border-color: var(--accent-fire);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        .control-btn svg {
            width: 32px;
            height: 32px;
            pointer-events: none;
            stroke-width: 2.5;
        }

        #notification-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            z-index: 50;
        }

        .toast {
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.5s ease-in 3s forwards;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.delivery { border-color: var(--accent-gold); }
        .toast.info { border-color: var(--accent-cyan); }
        .toast.combat { border-color: var(--accent-fire); }
        .toast.kill { border-color: #8b5cf6; }

        .floating-text {
            position: absolute;
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 1.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 40;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-60px) scale(1); }
        }

        .compass-ring {
            background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
            border-radius: 50%;
        }

        #crosshair-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        #crosshair-ui::before, #crosshair-ui::after {
            content: '';
            position: absolute;
            background: rgba(239, 68, 68, 0.8);
        }
        #crosshair-ui::before { top: 14px; left: 0; width: 30px; height: 2px; }
        #crosshair-ui::after { top: 0; left: 14px; width: 2px; height: 30px; }
        
        .weather-panel {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        /* ============ MOBILE HUD: the desktop panel is too wide for a
           phone screen — it was overlapping the minimap and the fixed
           Chart Room button was cutting off the rank line above it. Slim
           the panel down and give the Chart Room button its own row. */
        @media (max-width: 767px) {
            #hud-top-row { margin-top: 46px; }
            #game-hud {
                width: 168px !important;
                padding: 10px !important;
            }
            #game-hud .mb-4 { margin-bottom: 6px !important; }
            #game-hud .mb-5 { margin-bottom: 8px !important; }
            #game-hud #profit-status { font-size: 22px !important; }
            #hud-weather-compass { display: none !important; }
            #cargo-status { padding: 8px !important; gap: 8px !important; }
            #sailing-hud > :not([hidden]) ~ :not([hidden]) { margin-top: 8px !important; }
            #chart-room-btn {
                top: 8px !important;
                font-size: 12px !important;
                padding: 7px 14px !important;
            }
            #minimap-container { transform: scale(0.85); transform-origin: top right; }
        }
    </style>
</head>
<body>

    <div id="damage-overlay"></div>
    <div id="lightning-overlay"></div>
    <div id="canvas-container"></div>
    <div id="crosshair-ui"></div>

    <div id="ui-layer" class="p-4 md:p-6">
        
        <div id="notification-container"></div>
        <div id="floating-text-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:40;"></div>

        <div class="flex justify-between items-start w-full" id="hud-top-row">

            <div id="game-hud" class="glass-panel p-5 text-white w-[260px] md:w-[320px]">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex flex-col">
                        <span class="text-xs text-slate-400 font-semibold tracking-wider uppercase mb-1">Treasury</span>
                        <div id="profit-status" class="text-3xl font-black text-amber-400 drop-shadow-[0_2px_10px_rgba(251,191,36,0.3)] tabular-nums">0 <span class="text-xl">💰</span></div>
                    </div>

                    <div class="flex flex-col items-center gap-2" id="hud-weather-compass">
                        <div class="weather-panel" id="weather-display">
                            <span id="weather-icon" class="text-lg">☀️</span>
                            <span id="weather-text" class="text-xs font-bold text-slate-200 uppercase tracking-wider">Clear</span>
                        </div>
                        <div class="relative w-14 h-14 bg-slate-900/60 rounded-full border border-slate-700/50 flex items-center justify-center compass-ring shadow-inner">
                            <div class="absolute text-[10px] text-slate-400 top-1 font-bold">N</div>
                            <svg id="wind-compass-arrow" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-cyan-400 transition-transform duration-300 drop-shadow-[0_0_5px_rgba(34,211,238,0.5)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="transform: rotate(0deg);">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-4 4m4-4l4 4" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="mb-5 space-y-3">
                    <div>
                        <div class="flex justify-between font-semibold text-xs mb-1">
                            <span class="text-slate-400">Hull Integrity (HP)</span>
                            <span id="hp-text" class="text-emerald-400">1000/1000</span>
                        </div>
                        <div class="hud-bar-bg h-2">
                            <div id="hp-bar" class="hud-bar-fill bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: 100%;"></div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between font-semibold text-xs mb-1">
                            <span class="text-slate-400">Munitions (MP)</span>
                            <span id="mp-text" class="text-blue-400">100/100</span>
                        </div>
                        <div class="hud-bar-bg h-2">
                            <div id="mp-bar" class="hud-bar-fill bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                
                <div id="cargo-status" class="text-sm text-slate-300 font-semibold flex items-center gap-3 mb-5 bg-slate-900/40 p-3 rounded-xl border border-slate-700/50 transition-all duration-300">
                    <div class="p-1.5 bg-slate-800 rounded-lg" id="cargo-icon-bg">
                        <svg id="cargo-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                    </div>
                    <span id="cargo-text">Hold Empty</span>
                </div>

                <div class="mb-5">
                    <div class="flex justify-between font-semibold text-xs mb-1">
                        <span class="text-slate-400">Cannons (Click to Fire)</span>
                        <span id="weapon-status" class="text-emerald-400">Ready</span>
                    </div>
                    <div class="hud-bar-bg h-2">
                        <div id="reload-bar" class="hud-bar-fill bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: 100%;"></div>
                    </div>
                </div>
                
                <div id="sailing-hud" class="space-y-4">
                    <div>
                        <div class="flex justify-between font-semibold text-sm mb-1">
                            <span class="text-slate-400">Sails <span class="hidden md:inline">(W/S)</span></span>
                            <span id="trim-value" class="text-white">Furled</span>
                        </div>
                        <div class="hud-bar-bg">
                            <div id="trim-bar" class="hud-bar-fill bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between font-semibold text-sm mb-1">
                            <span class="text-slate-400">Wind Power</span>
                            <span id="point-of-sail" class="text-rose-400">In Irons</span>
                        </div>
                        <div class="hud-bar-bg">
                            <div id="efficiency-bar" class="hud-bar-fill bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="minimap-container" class="glass-panel p-2 rounded-full overflow-hidden border-2 border-slate-700/50 pointer-events-auto relative shadow-[0_0_30px_rgba(0,0,0,0.5)]">
                <div class="absolute inset-0 rounded-full border-[4px] border-amber-900/30 pointer-events-none z-20"></div>
                <div class="absolute inset-0 rounded-full border border-amber-400/20 pointer-events-none z-20"></div>
                <canvas id="minimap" width="160" height="160" class="rounded-full bg-slate-900 w-28 h-28 md:w-[160px] md:h-[160px] relative z-10"></canvas>
            </div>
        </div>

        <div class="w-full flex flex-col md:flex-row justify-between items-end gap-4 pointer-events-none mt-auto">
            
            <div id="mobile-controls" class="flex gap-4 p-2 select-none md:hidden pointer-events-auto pb-4 w-full justify-between items-end">
                <div class="grid grid-cols-3 gap-3">
                    <div></div>
                    <button id="btn-up" class="control-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" /></svg></button>
                    <div></div>
                    <button id="btn-left" class="control-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
                    <button id="btn-down" class="control-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg></button>
                    <button id="btn-right" class="control-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7-7" /></svg></button>
                </div>
                <button id="btn-fire" class="control-btn btn-fire rounded-full w-20 h-20 shadow-[0_0_20px_rgba(239,68,68,0.4)]">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-10 h-10"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                </button>
            </div>

            <div class="glass-panel p-4 rounded-2xl text-sm flex flex-col gap-3 pointer-events-auto ml-auto hidden md:flex border-l-4 border-l-rose-500">
                <div class="flex items-center gap-3">
                    <div class="flex gap-1">
                        <kbd class="bg-slate-800 text-slate-300 font-mono px-2 py-1 rounded-md border-b-2 border-slate-900 shadow-sm">A</kbd>
                        <kbd class="bg-slate-800 text-slate-300 font-mono px-2 py-1 rounded-md border-b-2 border-slate-900 shadow-sm">D</kbd> 
                    </div>
                    <span class="font-semibold text-slate-200">Steer Ship</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex gap-1">
                        <kbd class="bg-slate-800 text-slate-300 font-mono px-2 py-1 rounded-md border-b-2 border-slate-900 shadow-sm">W</kbd>
                        <kbd class="bg-slate-800 text-slate-300 font-mono px-2 py-1 rounded-md border-b-2 border-slate-900 shadow-sm">S</kbd> 
                    </div>
                    <span class="font-semibold text-slate-200">Trim Sails</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex gap-1">
                        <kbd class="bg-slate-800 text-rose-400 font-mono px-2 py-1 rounded-md border-b-2 border-slate-900 shadow-sm">L-Click</kbd>
                    </div>
                    <span class="font-semibold text-rose-300">Aim & Fire Weapons</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let ship, shipWrapper, water;
        let clock;
        let mainSail, foreSail, windFlag;
        let destinationArrow, destinationBeacon;
        let wakeParticles = [];
        let clouds = [];
        let birds = []; 
        let ambientLight, sunLight, skyLight;
        
        let keys = { w: false, a: false, s: false, d: false };
        
        let shipParams = { 
            speed: 0, maxSpeed: 0.6, accel: 0.009, friction: 0.975, 
            heading: 0, turnSpeed: 0.038, radius: 5, sailDeployed: 0,
            hp: 1000, maxHp: 1000, mp: 100, maxMp: 100, mpRegen: 0.25 
        };

        let windParams = {
            angle: Math.PI / 4, speed: 0.035, baseSpeed: 0.035,
            particlesSystem: null, timeElapsed: 0
        };
        
        const TIME_GRADIENTS = [
            { t: 0.00, c: new THREE.Color(0x050510) }, 
            { t: 0.20, c: new THREE.Color(0x0a0a2a) }, 
            { t: 0.25, c: new THREE.Color(0xff7e5f) }, 
            { t: 0.30, c: new THREE.Color(0x5eb1bf) }, 
            { t: 0.70, c: new THREE.Color(0x5eb1bf) }, 
            { t: 0.75, c: new THREE.Color(0xfeb47b) }, 
            { t: 0.80, c: new THREE.Color(0x0a0a2a) }, 
            { t: 1.00, c: new THREE.Color(0x050510) }  
        ];

        // SLOWED DOWN: Decreased timeOfDay speed to make days/nights much longer
        let timeOfDay = { cycle: 0.35, speed: 0.00008, sunDistance: 450 };
        let celestials = { sunMesh: null, moonMesh: null, stars: null, starMat: null, moonLight: null };

        const WEATHER_STATES = { CLEAR: 0, STORM: 1, FOG: 2 };
        // SLOWED DOWN: Increased base timer significantly so weather patterns last longer
        let weather = {
            state: WEATHER_STATES.CLEAR, timer: 180, 
            targetWeight: 0.0, currentWeight: 0.0, weatherColor: new THREE.Color(0x000000), 
            targetWaveMultiplier: 0.0, waveMultiplier: 0.0, targetWindSpeed: 0.035,
            targetFogDensity: 0.0015, fogDensity: 0.0015,
            rainSystem: null, rainCount: 3000, lightningLight: null, lightningTimer: 0
        };

        let islandData = []; let docks = [];
        let currentDestination = null; // contract destination dock

        // ============================================================
        // NAKHODA GAME CORE — economy, progression, ranks (from the
        // Austronesia Saga "Ascension" lore ladder)
        // ============================================================
        // Port names + positions live in js/data/ports.js (PORT_DATA),
        // shared with the atlas map.
        const MALUKU_PORTS = ["Ternate","Tidore","Banda","Ambon","Hitu"];
        const ENTREPOT_PORTS = ["Melaka","Brunei","Maynila","Demak","Pasai","Makassar"];

        const GOODS = [
            { n:"Rice",          p:8 },   { n:"Sea Salt",     p:6 },
            { n:"Betel & Areca", p:10 },  { n:"Cotton Cloth", p:14 },
            { n:"Beeswax",       p:18 },  { n:"Tripang",      p:22 },
            { n:"Ceramics",      p:30 },  { n:"Benzoin",      p:34 },
            { n:"Black Pepper",  p:40 },  { n:"Sandalwood",   p:44 },
            { n:"Cinnamon",      p:46 },  { n:"Camphor",      p:48 },
            { n:"Birds' Nests",  p:60 },  { n:"Nutmeg",       p:70 },
            { n:"Cloves",        p:80 },  { n:"Mace",         p:85 },
            { n:"Pearls",        p:90 },  { n:"Gold Dust",    p:120 }
        ];
        const SPICE_GOODS_IDX = [13,14,15]; // Nutmeg, Cloves, Mace

        // Hull ladder straight from the lore's Ascension table
        const SHIP_TIERS = [
            { n:"Kelulus",    hold:12,  hp:600,  spd:0.52, cost:0,     scale:0.85, desc:"Small, swift, half-borrowed, patched everywhere. But she's yours." },
            { n:"Pencalang",  hold:26,  hp:950,  spd:0.58, cost:1500,  scale:0.95, desc:"The trader's path. Your ship, your cargo, your stake, your risk." },
            { n:"Malangbang", hold:44,  hp:1300, spd:0.61, cost:4200,  scale:1.05, desc:"Broad and flat-bottomed — you're chasing bulk and range now." },
            { n:"Lancaran",   hold:64,  hp:1800, spd:0.67, cost:9500,  scale:1.15, desc:"War-fleet backbone. A name that reaches ports you've never sailed to." },
            { n:"Jong",       hold:110, hp:2600, spd:0.63, cost:21000, scale:1.3,  desc:"The ceiling of single-hull growth. The biggest cargo hull in the known world." }
        ];

        // rank: [name, requirement fn]
        const RANKS = [
            { n:"The First Ship",  req:g=>true },
            { n:"Nakhoda",         req:g=>g.tier>=1 },
            { n:"Rising Nakhoda",  req:g=>g.tier>=2 && g.rep>=30 },
            { n:"Master Nakhoda",  req:g=>g.tier>=3 && g.rep>=80 },
            { n:"Jong-Owner",      req:g=>g.tier>=4 },
            { n:"Sea Lord",        req:g=>g.seaLord }
        ];
        const SEA_LORD_GOLD = 15000, SEA_LORD_REP = 200;

        let game = {
            gold: 250, day: 1, rep: 0,
            cargo: {},                    // { goodName: { qty, cost } }
            tier: 0,
            upg: { hull:0, sails:0, guns:0 },
            contract: null,               // { good, qty, destIdx, reward, expiresDay }
            stats: { deliveries:0, piratesSunk:0, merchantsSunk:0, earned:0 },
            seaLord: false,
            known: {}                     // port intel gathered by visiting: { portName: { day, produces, demands } }
        };
        let portOpen = null;              // dock currently docked at
        let nearDockRef = null;
        let lastCycle = 0;
        let voyageBookTitle = "Crescent and Crossroads";

        function rankName(){ let r = RANKS[0].n; RANKS.forEach(rk => { if (rk.req(game)) r = rk.n; }); return r; }
        function holdMax(){ return SHIP_TIERS[game.tier].hold; }
        function holdUsed(){ return Object.values(game.cargo).reduce((s,c)=>s+c.qty,0); }
        function playerCannonDamage(){ return CANNON_DAMAGE * (1 + game.upg.guns*0.18 + game.tier*0.1); }
        function playerGunDamage(){ return GUN_DAMAGE * (1 + game.upg.guns*0.18 + game.tier*0.1); }

        // deterministic per-(port, good, day) price noise
        function hashNoise(a,b,c){ let x = Math.sin(a*127.1 + b*311.7 + c*74.7) * 43758.5453; return x - Math.floor(x); }
        function priceAt(dockIdx, goodIdx, mode){ // mode: 'buy' | 'sell'
            const d = docks[dockIdx]; const g = GOODS[goodIdx];
            let mult = 0.9 + hashNoise(dockIdx, goodIdx, game.day) * 0.4;
            if (d.produces.includes(goodIdx)) mult = 0.5 + hashNoise(dockIdx, goodIdx, game.day) * 0.15;
            if (d.demands.includes(goodIdx))  mult = 1.7 + hashNoise(dockIdx, goodIdx, game.day) * 0.5;
            let base = g.p * mult;
            return Math.max(2, Math.round(mode === 'buy' ? base * 1.06 : base * 0.94));
        }

        function assignPortNames() {
            // One dock per PORT_DATA entry, in order — indices are stable
            // across sessions, so saved contracts point at the same port.
            docks.forEach((d, i) => { d.name = PORT_DATA[i].name; d.idx = i; });
        }

        function buildEconomies(){
            docks.forEach((d, i) => {
                d.produces = []; d.demands = [];
                if (MALUKU_PORTS.includes(d.name)) {
                    // The clove islands: the whole game's gravity well
                    d.produces = [ SPICE_GOODS_IDX[i % 3], SPICE_GOODS_IDX[(i+1) % 3] ];
                    d.demands  = [ 0, 3 ]; // Rice, Cotton Cloth — they can't feed themselves on cloves
                } else if (ENTREPOT_PORTS.includes(d.name)) {
                    d.demands  = [ SPICE_GOODS_IDX[i % 3], 16 ]; // spices + pearls
                    d.produces = [ 6, 17 ][i % 2] === 6 ? [6] : [17]; // ceramics or gold dust flow through
                    d.produces.push(3);
                } else {
                    // provincial ports: two local products, two local hungers
                    const a = Math.floor(hashNoise(i, 1, 7) * 13);           // cheap-to-mid goods
                    const b = Math.floor(hashNoise(i, 2, 7) * 13);
                    const c = 5 + Math.floor(hashNoise(i, 3, 7) * 13);       // mid-to-rich goods
                    const e = 5 + Math.floor(hashNoise(i, 4, 7) * 13);
                    d.produces = [...new Set([a, b])];
                    d.demands  = [...new Set([c, e])].filter(x => !d.produces.includes(x));
                    if (!d.demands.length) d.demands = [(c + 1) % GOODS.length];
                }
            });
        }

        function notifyParent(msg) { try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*"); } catch (e) {} }

        function saveGame(){
            const save = {
                v: 3,
                gold: game.gold, day: game.day, rep: game.rep, cargo: game.cargo,
                tier: game.tier, upg: game.upg, stats: game.stats, seaLord: game.seaLord,
                contract: game.contract, known: game.known
            };
            // The world is fixed geography now, so a voyage can resume mid-sea.
            if (typeof shipWrapper !== 'undefined' && shipWrapper) {
                save.x = Math.round(shipWrapper.position.x);
                save.z = Math.round(shipWrapper.position.z);
                save.heading = shipParams.heading;
                save.hp = Math.round(shipParams.hp);
            }
            notifyParent({ type:"nakhoda-save", save });
        }
        function loadGame(s){
            if (!s) return;
            game.gold = s.gold ?? game.gold; game.day = s.day ?? 1; game.rep = s.rep ?? 0;
            game.cargo = s.cargo || {}; game.tier = Math.min(s.tier ?? 0, SHIP_TIERS.length-1);
            game.upg = Object.assign({hull:0,sails:0,guns:0}, s.upg);
            game.stats = Object.assign(game.stats, s.stats); game.seaLord = !!s.seaLord;
            game.known = s.known || {};
            game.contract = (s.contract && docks[s.contract.destIdx]) ? s.contract : null;
            currentDestination = game.contract ? docks[game.contract.destIdx] : null;
            applyShipStats(true);
            if (typeof s.x === 'number' && typeof s.z === 'number' && shipWrapper) {
                shipWrapper.position.set(s.x, 0, s.z);
                if (typeof s.heading === 'number') shipParams.heading = s.heading;
            }
            if (typeof s.hp === 'number') shipParams.hp = Math.max(50, Math.min(s.hp, shipParams.maxHp));
            updateVitalsUI();
            refreshGameHUD();
        }

        function applyShipStats(fullHeal){
            const t = SHIP_TIERS[game.tier];
            shipParams.maxHp = t.hp + game.upg.hull * 250;
            shipParams.maxSpeed = t.spd + game.upg.sails * 0.035;
            if (fullHeal) shipParams.hp = shipParams.maxHp;
            shipParams.hp = Math.min(shipParams.hp, shipParams.maxHp);
            if (typeof ship !== 'undefined' && ship) ship.scale.setScalar(t.scale);
            updateVitalsUI();
        }

                    `The sea remains. Keep sailing, Sea Lord — the Game above the waves is only beginning.`);

            }
        }

                    `<button data-act="abandon" style="${NK_BTN}width:100%;margin-top:8px;background:rgba(244,63,94,0.15);color:#fb7185;font-weight:700;font-size:12px;padding:8px;">Abandon charter (\u22124 Rep)</button></div>`;
            } else {
                html += `<button data-act="contract" style="${NK_BTN}width:100%;margin-bottom:12px;background:rgba(52,211,153,0.15);color:#34d399;font-weight:700;padding:12px;">\u{1F4DC} Ask for a charter</button>`;
            }
            html += `<button data-act="rumor" style="${NK_BTN}width:100%;background:rgba(59,130,246,0.15);color:#60a5fa;font-weight:700;padding:12px;">\u{1F442} Buy a rumor \u2014 15 pisis</button>` +
                `<div id="nk-rumor-out" style="font-size:13px;color:#cbd5e1;margin-top:10px;"></div>` +
                `<div style="margin-top:16px;font-size:11.5px;color:#64748b;">Ledger: ${game.stats.deliveries} charters \u00b7 ${game.stats.piratesSunk} pirates sunk \u00b7 ${game.stats.earned} pisis earned lifetime</div>`;

        // ---------- Port actions ----------
        function wirePortActions(dock){
            document.getElementById('nk-port-body').querySelectorAll('button[data-act]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const act = btn.dataset.act;
                    if (act === 'buy') doTrade(dock, parseInt(btn.dataset.g), parseInt(btn.dataset.q), true);
                    else if (act === 'sell') doTrade(dock, parseInt(btn.dataset.g), parseInt(btn.dataset.q), false);
                    else if (act === 'sellall') { const g = GOODS[parseInt(btn.dataset.g)]; const own = (game.cargo[g.n]||{qty:0}).qty; if (own>0) doTrade(dock, parseInt(btn.dataset.g), own, false); }
                    else if (act === 'repair') doRepair();
                    else if (act === 'upg') doUpgrade(btn.dataset.k);
                    else if (act === 'tier') doBuyTier();
                    else if (act === 'contract') doContract(dock);
                    else if (act === 'fulfill') doFulfill(dock);
                    else if (act === 'abandon') { game.contract = null; currentDestination = null; addRep(-4); showToast("Charter abandoned. Word travels. (\u22124 Rep)", "combat"); renderPortBody(dock); }
                    else if (act === 'rumor') doRumor(dock);
                });
            });
        }

        function doTrade(dock, gi, qty, buying){
            const g = GOODS[gi];
            if (buying) {
                const price = priceAt(dock.idx, gi, 'buy');
                const canHold = holdMax() - holdUsed();
                qty = Math.min(qty, canHold, Math.floor(game.gold / price));
                if (qty <= 0) { showToast(canHold <= 0 ? "Hold is full, Nakhoda." : "Not enough pisis.", "combat"); return; }
                addGold(-price * qty);
                const c = game.cargo[g.n] || { qty:0, cost:0 };
                c.cost = Math.round((c.cost * c.qty + price * qty) / (c.qty + qty)); c.qty += qty;
                game.cargo[g.n] = c;
            } else {
                const c = game.cargo[g.n]; if (!c || c.qty <= 0) return;
                qty = Math.min(qty, c.qty);
                const price = priceAt(dock.idx, gi, 'sell');
                addGold(price * qty); c.qty -= qty;
                const margin = (price - c.cost) * qty;
                if (margin > 0) { showFloatingText(`+${margin} profit`, shipWrapper.position.x, shipWrapper.position.y + 10); }
                if (c.qty <= 0) delete game.cargo[g.n];
            }
            refreshGameHUD(); renderPortBody(dock);
            saveGame(); // a trade is real money — never lose it to a closed tab
        }

        function doRepair(){
            const dmg = Math.floor(shipParams.maxHp - shipParams.hp);
            const cost = Math.ceil(dmg / 3);
            if (dmg <= 0) return;
            if (game.gold < cost) { showToast("Not enough pisis for the shipwrights.", "combat"); return; }
            addGold(-cost); shipParams.hp = shipParams.maxHp; updateVitalsUI(); renderPortBody(portOpen);
            showToast("Hull repaired. She's whole again.", "success");
        }

        function doUpgrade(k){
            const base = { hull:400, sails:500, guns:450 }[k];
            const cost = base * (game.upg[k] + 1);
            if (game.upg[k] >= 5) return;
            if (game.gold < cost) { showToast("Not enough pisis.", "combat"); return; }
            addGold(-cost); game.upg[k]++; applyShipStats(false); renderPortBody(portOpen); saveGame();
            showToast("The shipwrights work through the night.", "success");
        }

        function doBuyTier(){
            const nx = SHIP_TIERS[game.tier + 1]; if (!nx) return;
            if (game.gold < nx.cost) { showToast(`The ${nx.n} costs ${nx.cost} pisis. Keep trading.`, "combat"); return; }
            addGold(-nx.cost); game.tier++; applyShipStats(true); addRep(10);
            showEventOverlay(`\u26F5 The ${nx.n}`,
                `${nx.desc}<br><br>Hold <b>${nx.hold}</b> \u00b7 Hull <b>${nx.hp}</b> \u00b7 Rank: <b style="color:#fbbf24;">${rankName()}</b><br><br><i>The boy on the jetty would not recognize the man at this stern.</i>`);
            renderPortBody(portOpen); refreshGameHUD(); saveGame();
        }

        function doContract(dock){
            // Charter: haul goods this port produces (cheap here) to a port that craves them
            const candidates = [];
            docks.forEach(d => { if (d !== dock) d.demands.forEach(gi => { if (dock.produces.includes(gi)) candidates.push({d, gi}); }); });
            let pick;
            if (candidates.length) pick = candidates[Math.floor(Math.random()*candidates.length)];
            else { const d = docks[Math.floor(Math.random()*docks.length)]; pick = { d: d === dock ? docks[(d.idx+1)%docks.length] : d, gi: dock.produces[0] ?? 0 }; }
            const dist = Math.hypot(pick.d.x - dock.x, pick.d.z - dock.z);
            const qty = 3 + Math.floor(Math.random()*5) + game.tier * 2;
            const value = priceAt(pick.d.idx, pick.gi, 'sell') * qty;
            const reward = Math.round(value * 0.8 + dist * 0.4);
            const days = 2 + Math.ceil(dist / 500);
            game.contract = { good: GOODS[pick.gi].n, qty, destIdx: pick.d.idx, reward, expiresDay: game.day + days };
            currentDestination = pick.d;
            showToast(`Charter taken: ${qty} ${GOODS[pick.gi].n} to ${pick.d.name} by Day ${game.day + days}.`, "success");
            refreshGameHUD(); renderPortBody(dock); saveGame();
        }

        function doFulfill(dock){
            const c = game.contract; if (!c || docks[c.destIdx] !== dock) return;
            const have = game.cargo[c.good]; if (!have || have.qty < c.qty) return;
            have.qty -= c.qty; if (have.qty <= 0) delete game.cargo[c.good];
            addGold(c.reward); addRep(6); game.stats.deliveries++;
            game.contract = null; currentDestination = null;
            showToast(`Charter delivered! ${c.reward} pisis, and ${dock.name} remembers your name. (+6 Rep)`, "delivery");
            refreshGameHUD(); renderPortBody(dock); saveGame();
        }

        function doRumor(dock){
            if (game.gold < 15) { showToast("Even rumors cost pisis here.", "combat"); return; }
            addGold(-15);
            // Find the best sell price anywhere for something worth hauling
            let best = null;
            docks.forEach(d => { if (d === dock) return; d.demands.forEach(gi => {
                const p = priceAt(d.idx, gi, 'sell');
                if (!best || p > best.p) best = { d, gi, p };
            }); });
            const out = document.getElementById('nk-rumor-out');
            if (best) out.innerHTML = `<i>"A pilot swears that <b>${GOODS[best.gi].n}</b> is fetching <b style="color:#fbbf24;">${best.p} pisis</b> a unit in <b>${best.d.name}</b> right now\u2026"</i>`;
            else out.innerHTML = `<i>The tavern has no news worth the coin tonight.</i>`;
        }

        // ---------- Per-frame game logic ----------
        function nakhodaFrame(){
            // Day cycle: timeOfDay.cycle wraps 0..1
            if (timeOfDay.cycle < lastCycle - 0.5) {
                game.day++;
                showToast(`\u{1F305} Day ${game.day} \u2014 prices shift with the tide.`, "info");
                if (game.contract && game.day > game.contract.expiresDay) {
                    showToast(`Charter to ${docks[game.contract.destIdx].name} expired. (\u22125 Rep)`, "combat");
                    game.contract = null; currentDestination = null; addRep(-5);
                }
                refreshGameHUD(); saveGame();
                if (portOpen) renderPortBody(portOpen);
            }
            lastCycle = timeOfDay.cycle;

            // While docked: hold the ship still
            if (portOpen) {
                keys.w = keys.a = keys.s = keys.d = false;
                shipParams.speed *= 0.8; shipParams.sailDeployed = 0;
                return;
            }

            // Dock proximity prompt
            let near = null;
            if (Math.abs(shipParams.speed) < 0.15) {
                for (let dock of docks) {
                    if (Math.hypot(dock.x - shipWrapper.position.x, dock.z - shipWrapper.position.z) < dock.radius + 11) { near = dock; break; }
                }
            }
            const prompt = document.getElementById('nk-dock-prompt');
            if (near && !nearDockRef) { prompt.innerHTML = `\u2693 Enter ${near.name}`; prompt.style.display = 'block'; }
            else if (near && near !== nearDockRef) { prompt.innerHTML = `\u2693 Enter ${near.name}`; }
            else if (!near && nearDockRef) { prompt.style.display = 'none'; }
            nearDockRef = near;
        }

        function setupLighting() {

        function createSkybox() {
            const sunGeo = new THREE.SphereGeometry(18, 32, 32); const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffee, fog: false }); 
            celestials.sunMesh = new THREE.Mesh(sunGeo, sunMat); scene.add(celestials.sunMesh);

            const moonGeo = new THREE.SphereGeometry(12, 32, 32); const moonMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, fog: false });
            celestials.moonMesh = new THREE.Mesh(moonGeo, moonMat); scene.add(celestials.moonMesh);

            const starGeo = new THREE.BufferGeometry(); const starCount = 2000; const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i+=3) {
                let u = Math.random(); let v = Math.random();
                let theta = u * 2.0 * Math.PI; let phi = Math.acos(2.0 * v - 1.0);
                let r = 500 + Math.random() * 200; 
                if (Math.cos(phi) < -0.1) phi = Math.PI - phi;
                starPos[i] = r * Math.sin(phi) * Math.cos(theta); starPos[i+1] = r * Math.sin(phi) * Math.sin(theta); starPos[i+2] = r * Math.cos(phi);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            celestials.starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, transparent: true, opacity: 0, fog: false });
            celestials.stars = new THREE.Points(starGeo, celestials.starMat); scene.add(celestials.stars);
        }

        function getSkyColorAtTime(t) {
            for (let i = 0; i < TIME_GRADIENTS.length - 1; i++) {
                if (t >= TIME_GRADIENTS[i].t && t <= TIME_GRADIENTS[i+1].t) {
                    let range = TIME_GRADIENTS[i+1].t - TIME_GRADIENTS[i].t; let factor = (t - TIME_GRADIENTS[i].t) / range;
                    let col = TIME_GRADIENTS[i].c.clone(); return col.lerp(TIME_GRADIENTS[i+1].c, factor);
                }
            }
            return TIME_GRADIENTS[0].c.clone();
        }

        function updateEnvironment(delta) {
            timeOfDay.cycle += timeOfDay.speed * delta * 60; if(timeOfDay.cycle >= 1) timeOfDay.cycle -= 1;
            let t = timeOfDay.cycle; let angle = (t * Math.PI * 2) - (Math.PI / 2); let dist = timeOfDay.sunDistance;

            let sx = Math.cos(angle) * dist; let sy = Math.sin(angle) * dist; let sz = Math.cos(angle) * 120; 
            let cx = shipWrapper ? shipWrapper.position.x : 0; let cz = shipWrapper ? shipWrapper.position.z : 0;

            celestials.sunMesh.position.set(cx + sx, sy, cz + sz); sunLight.position.copy(celestials.sunMesh.position);
            celestials.moonMesh.position.set(cx - sx, -sy, cz - sz); celestials.moonLight.position.copy(celestials.moonMesh.position);
            celestials.stars.position.set(cx, 0, cz);

            let sunAlt = Math.sin(angle); 
            let bSunInt = Math.max(0, sunAlt) * 2.5; let bMoonInt = Math.max(0, -sunAlt) * 0.7;
            let bAmbInt = 0.1 + (Math.max(0, sunAlt) * 0.35) + (Math.max(0, -sunAlt) * 0.1); let bSkyLightInt = bAmbInt * 0.8;
            let bColor = getSkyColorAtTime(t); let starOp = Math.max(0, -sunAlt * 2.0); 

            if (sunAlt > 0 && sunAlt < 0.25) {
                let redness = 1.0 - (sunAlt / 0.25); celestials.sunMesh.material.color.setRGB(1, 1 - redness*0.3, 1 - redness*0.6);
            } else { celestials.sunMesh.material.color.setHex(0xffffee); }

            weather.currentWeight += (weather.targetWeight - weather.currentWeight) * delta * 1.5;
            weather.fogDensity += (weather.targetFogDensity - weather.fogDensity) * delta * 0.5;
            scene.fog.density = weather.fogDensity;

            let finalColor = bColor.clone();
            if (weather.currentWeight > 0.01) finalColor.lerp(weather.weatherColor, weather.currentWeight * 0.95);
            scene.background.copy(finalColor); scene.fog.color.copy(finalColor);

            let lightDimmer = 1.0 - (weather.currentWeight * (weather.state === WEATHER_STATES.STORM ? 0.9 : 0.7));
            sunLight.intensity = bSunInt * lightDimmer; celestials.moonLight.intensity = bMoonInt * lightDimmer;
            ambientLight.intensity = bAmbInt * (1.0 - weather.currentWeight * 0.3); skyLight.intensity = bSkyLightInt * (1.0 - weather.currentWeight * 0.3);
            
            let celestialVisibility = 1.0 - (weather.currentWeight * (weather.state === WEATHER_STATES.FOG ? 1.0 : 0.8));
            celestials.sunMesh.scale.setScalar(Math.max(0.01, celestialVisibility)); celestials.moonMesh.scale.setScalar(Math.max(0.01, celestialVisibility));
            celestials.starMat.opacity = starOp * celestialVisibility;
        }

        function createWeatherSystems() {
            const rainGeo = new THREE.BufferGeometry(); const rainPositions = new Float32Array(weather.rainCount * 6); 
            for (let i = 0; i < weather.rainCount; i++) {
                let x = (Math.random() - 0.5) * 400; let y = Math.random() * 200; let z = (Math.random() - 0.5) * 400;
                rainPositions[i * 6] = x; rainPositions[i * 6 + 1] = y; rainPositions[i * 6 + 2] = z;
                rainPositions[i * 6 + 3] = x; rainPositions[i * 6 + 4] = y - 2; rainPositions[i * 6 + 5] = z;
            }
            rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
            const rainMat = new THREE.LineBasicMaterial({ color: 0x9ca3af, transparent: true, opacity: 0.0, depthWrite: false });
            weather.rainSystem = new THREE.LineSegments(rainGeo, rainMat); weather.rainSystem.position.y = 50; scene.add(weather.rainSystem);
            weather.lightningLight = new THREE.PointLight(0xe0f2fe, 0, 500); scene.add(weather.lightningLight);
        }

        function triggerLightning() {

        function handleWeatherState(delta) {
            weather.timer -= delta;
            if (weather.timer <= 0) {
                const rand = Math.random(); let nextState;
                if (rand < 0.5) nextState = WEATHER_STATES.CLEAR;
                else if (rand < 0.75) nextState = WEATHER_STATES.STORM;
                else nextState = WEATHER_STATES.FOG;
                if (nextState === weather.state) nextState = WEATHER_STATES.CLEAR; 
                
                // SLOWED DOWN: Random timer is much longer (between 3 to 6 minutes)
                weather.state = nextState; weather.timer = 180 + Math.random() * 180; 
                
                switch(weather.state) {
                    case WEATHER_STATES.CLEAR:
                        weather.targetWeight = 0.0; weather.targetFogDensity = 0.0015; weather.targetWaveMultiplier = 0.0; weather.targetWindSpeed = windParams.baseSpeed;
                        updateWeatherUI("☀️", "Clear", "text-amber-300", "border-amber-500/50"); showToast("The skies are clearing up.", "info"); break;
                    case WEATHER_STATES.STORM:
                        weather.targetWeight = 1.0; weather.weatherColor.setHex(0x1a2436); weather.targetFogDensity = 0.0035; weather.targetWaveMultiplier = 1.5; weather.targetWindSpeed = windParams.baseSpeed * 2.5;
                        updateWeatherUI("⛈️", "Storm", "text-rose-400", "border-rose-500/50"); showToast("A fierce storm is approaching! Waves rising.", "combat"); break;
                    case WEATHER_STATES.FOG:
                        weather.targetWeight = 1.0; weather.weatherColor.setHex(0xa8b6c4); weather.targetFogDensity = 0.012; weather.targetWaveMultiplier = -0.5; weather.targetWindSpeed = windParams.baseSpeed * 0.3;
                        updateWeatherUI("🌫️", "Dense Fog", "text-slate-300", "border-slate-400/50"); showToast("Thick fog sets in. Visibility severely reduced.", "info"); break;
                }
            }
            
            weather.waveMultiplier += (weather.targetWaveMultiplier - weather.waveMultiplier) * 0.05;
            if (water && water.material.userData.stormMultiplier) water.material.userData.stormMultiplier.value = weather.waveMultiplier;
            windParams.speed += (weather.targetWindSpeed - windParams.speed) * 0.05;
            
            const targetRainOpacity = (weather.state === WEATHER_STATES.STORM) ? 0.6 : 0.0;
            weather.rainSystem.material.opacity += (targetRainOpacity - weather.rainSystem.material.opacity) * 0.05;
            
            if (weather.rainSystem.material.opacity > 0.01 && shipWrapper) {
                const positions = weather.rainSystem.geometry.attributes.position.array;
                const dropSpeed = 80 * delta; const sx = shipWrapper.position.x; const sz = shipWrapper.position.z;
                for(let i = 0; i < weather.rainCount; i++) {
                    let idx = i * 6; positions[idx + 1] -= dropSpeed; positions[idx + 4] -= dropSpeed;
                    if (positions[idx + 1] < -10) {
                        let newX = sx + (Math.random() - 0.5) * 300; let newZ = sz + (Math.random() - 0.5) * 300; let newY = 150 + Math.random() * 100;
                        positions[idx] = newX; positions[idx + 1] = newY; positions[idx + 2] = newZ;
                        positions[idx + 3] = newX; positions[idx + 4] = newY - (3 + Math.random() * 4); positions[idx + 5] = newZ;
                    }
                }
                weather.rainSystem.geometry.attributes.position.needsUpdate = true;
            }
            
            if (weather.lightningLight.intensity > 0) {
                weather.lightningLight.intensity *= 0.85; if(weather.lightningLight.intensity < 0.1) weather.lightningLight.intensity = 0;
            }
            if (weather.state === WEATHER_STATES.STORM) {
                weather.lightningTimer -= delta;
                if (weather.lightningTimer <= 0) { triggerLightning(); weather.lightningTimer = 2 + Math.random() * 8; }
            }
        }

        function updateWeatherUI(icon, text, textColor, borderColor) {
            const panel = document.getElementById('weather-display'); document.getElementById('weather-icon').innerText = icon;
            const textEl = document.getElementById('weather-text'); textEl.innerText = text;

        function getWaveHeightAt(x, z, time) {
            let t = time * 0.8; let y = 0.0;
            y += 0.6 * Math.sin((x * 0.015) + (z * 0.01) - t * 1.2); y += 0.4 * Math.sin((x * -0.01) + (z * 0.02) - t * 1.5 + 2.0);
            y += 0.25 * Math.pow(1.0 - Math.abs(Math.sin((x * 0.04) - (z * 0.03) - t * 2.5)), 2.0); y += 0.15 * Math.pow(1.0 - Math.abs(Math.sin((x * 0.07) + (z * 0.05) - t * 3.2 + 1.0)), 1.5);
            y *= (1.0 + weather.waveMultiplier); return y; 
        }

        function createRealisticWater() {
            const waterGeometry = new THREE.PlaneGeometry(3000, 3000, 350, 350); waterGeometry.rotateX(-Math.PI / 2); 
            
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = 'rgb(128, 128, 255)'; ctx.fillRect(0, 0, 256, 256);
            const imgData = ctx.getImageData(0, 0, 256, 256);
            
            for (let i = 0; i < imgData.data.length; i += 4) {
                let x = ((i / 4) % 256) / 256.0 * Math.PI * 4; let y = (Math.floor((i / 4) / 256)) / 256.0 * Math.PI * 4;
                let nx = Math.sin(x*3.0) * Math.cos(y*2.0) * 127; let ny = Math.sin(y*4.0) * Math.cos(x*1.5) * 127;
                imgData.data[i] = 128 + nx * 0.4; imgData.data[i+1] = 128 + ny * 0.4; imgData.data[i+2] = 255;              
            }
            ctx.putImageData(imgData, 0, 0);
            const normalMap = new THREE.CanvasTexture(canvas); normalMap.wrapS = THREE.RepeatWrapping; normalMap.wrapT = THREE.RepeatWrapping; normalMap.repeat.set(120, 120); 

            const waterMaterial = new THREE.MeshStandardMaterial({
                color: COLORS.waterBase, roughness: 0.08, metalness: 0.9, normalMap: normalMap,
                normalScale: new THREE.Vector2(0.5, 0.5), transparent: true, opacity: 0.92,
            });

            waterMaterial.userData.time = { value: 0 }; waterMaterial.userData.stormMultiplier = { value: 0.0 };
            
            waterMaterial.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = waterMaterial.userData.time; shader.uniforms.uStormMult = waterMaterial.userData.stormMultiplier;
                shader.vertexShader = `
                    uniform float uTime; uniform float uStormMult; varying float vWaveHeight; varying vec2 vPosXZ;
                    float calculateWave(vec3 pos) {
                        float t = uTime * 0.8; float y = 0.0;
                        y += 0.6 * sin((pos.x * 0.015) + (pos.z * 0.01) - t * 1.2); y += 0.4 * sin((pos.x * -0.01) + (pos.z * 0.02) - t * 1.5 + 2.0);
                        y += 0.25 * pow(1.0 - abs(sin((pos.x * 0.04) - (pos.z * 0.03) - t * 2.5)), 2.0); y += 0.15 * pow(1.0 - abs(sin((pos.x * 0.07) + (pos.z * 0.05) - t * 3.2 + 1.0)), 1.5);
                        y *= (1.0 + uStormMult); return y;
                    }
                ` + shader.vertexShader;

                shader.vertexShader = shader.vertexShader.replace(
                    `#include <begin_vertex>`,
                    `vec3 transformed = vec3(position); float h = calculateWave(transformed); transformed.y += h; vWaveHeight = h; vPosXZ = transformed.xz;
                    float eps = 0.5; float hx1 = calculateWave(transformed + vec3(eps, 0, 0)); float hx2 = calculateWave(transformed - vec3(eps, 0, 0));
                    float hz1 = calculateWave(transformed + vec3(0, 0, eps)); float hz2 = calculateWave(transformed - vec3(0, 0, eps));
                    vec3 newNormal = normalize(vec3(hx2 - hx1, 2.0 * eps, hz2 - hz1)); objectNormal = newNormal; `
                );

                shader.fragmentShader = `
                    varying float vWaveHeight; varying vec2 vPosXZ; uniform float uStormMult;
                    float random(vec2 p) { return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453123); }
                ` + shader.fragmentShader;

                shader.fragmentShader = shader.fragmentShader.replace(
                    `#include <color_fragment>`,
                    `#include <color_fragment>
                    float baseScatter = 1.2 * (1.0 + uStormMult * 0.5); float scatterAmt = smoothstep(0.0, baseScatter, vWaveHeight);
                    vec3 scatterColor = mix(vec3(0.13, 0.82, 0.93), vec3(0.05, 0.4, 0.5), max(0.0, uStormMult)); diffuseColor.rgb = mix(diffuseColor.rgb, scatterColor, scatterAmt * 0.4);
                    float noise = random(floor(vPosXZ * 0.15)); float fineNoise = random(floor(vPosXZ * 0.8)); float combinedNoise = (noise * 0.7) + (fineNoise * 0.3);
                    float baseFoam = 1.4 + (uStormMult * 0.8); float foamStart = 0.5 + combinedNoise * 0.5 + (uStormMult * 0.3); float foamAmt = smoothstep(foamStart, baseFoam, vWaveHeight);
                    vec3 foamColor = vec3(0.96, 0.98, 1.0); diffuseColor.rgb = mix(diffuseColor.rgb, foamColor, foamAmt * (0.9 + uStormMult * 0.1));
                    `
                );
            };

            water = new THREE.Mesh(waterGeometry, waterMaterial); water.receiveShadow = true; scene.add(water);
        }

        }

        function spawnJellyfishLump(cx, cz, radius) {
            const count = 4 + Math.floor(Math.random()*5);
            const r = Math.random() * radius; const theta = Math.random() * Math.PI * 2;
            const px = cx + Math.cos(theta)*r; const pz = cz + Math.sin(theta)*r;
            
            for(let i=0; i<count; i++) {
                const group = new THREE.Group();
                const dome = new THREE.Mesh(seaCreatures.geometries.jellyDome, seaCreatures.materials.jellyfish); group.add(dome);
                for(let t=0; t<4; t++) {
                    const tent = new THREE.Mesh(seaCreatures.geometries.jellyTentacle, seaCreatures.materials.jellyfish);
                    tent.position.set(Math.cos(t*Math.PI/2)*0.4, 0, Math.sin(t*Math.PI/2)*0.4); group.add(tent);
                }
                group.position.set(px + (Math.random()-0.5)*10, -3 - Math.random()*5, pz + (Math.random()-0.5)*10);
                scene.add(group);
                seaCreatures.jellyfish.push({ mesh: group, phase: Math.random()*Math.PI*2, baseDepth: group.position.y });
            }
        }

        function spawnFishSchool(cx, cz, radius) {
            const count = 40;
            const mesh = new THREE.InstancedMesh(seaCreatures.geometries.fish, seaCreatures.materials.fishMat, count);
            const r = Math.random() * radius; const theta = Math.random() * Math.PI * 2;
            const px = cx + Math.cos(theta)*r; const pz = cz + Math.sin(theta)*r;
            mesh.position.set(px, -4, pz); scene.add(mesh);
            
            const fishData = [];
            for(let i=0; i<count; i++) {
                fishData.push({ offset: new THREE.Vector3((Math.random()-0.5)*8, (Math.random()-0.5)*3, (Math.random()-0.5)*8), phase: Math.random()*Math.PI*2 });
            }
            seaCreatures.schools.push({ mesh: mesh, data: fishData, angle: Math.random()*Math.PI*2, speed: 0.05, turnTimer: 0 });
        }

        function updateSeaCreatures(delta, time) {
            if(!shipWrapper) return;
            const sx = shipWrapper.position.x; const sz = shipWrapper.position.z;
            const dummy = new THREE.Object3D();

            // Sharks
            for(let i=seaCreatures.sharks.length-1; i>=0; i--) {
                let shark = seaCreatures.sharks[i];
                shark.turnTimer--; if(shark.turnTimer <= 0) { shark.angle += (Math.random()-0.5)*1.5; shark.turnTimer = 100 + Math.random()*200; }
                
                shark.mesh.position.x += Math.cos(shark.angle) * shark.speed; shark.mesh.position.z -= Math.sin(shark.angle) * shark.speed;
                shark.mesh.rotation.y = shark.angle;
                
                let wh = getWaveHeightAt(shark.mesh.position.x, shark.mesh.position.z, time);
                shark.bobPhase += 0.05;
                shark.mesh.position.y = wh - 1.2 + Math.sin(shark.bobPhase)*0.5;

                if(Math.hypot(sx - shark.mesh.position.x, sz - shark.mesh.position.z) > 1000) {
                    scene.remove(shark.mesh); seaCreatures.sharks.splice(i, 1); spawnShark(sx, sz, 800);
                }
            }

            // Whales
            for(let i=seaCreatures.whales.length-1; i>=0; i--) {
                let whale = seaCreatures.whales[i];
                whale.mesh.position.x += Math.cos(whale.angle) * whale.speed; whale.mesh.position.z -= Math.sin(whale.angle) * whale.speed;
                whale.mesh.rotation.y = whale.angle;
                whale.tailMesh.rotation.x = Math.sin(time * 2) * 0.2;

                whale.timer--;
                if(whale.state === 'deep') {
                    whale.mesh.position.y += (whale.baseDepth - whale.mesh.position.y) * 0.01;
                    if(whale.timer <= 0) { whale.state = 'rising'; whale.timer = 200; }
                } else if (whale.state === 'rising') {
                    whale.mesh.position.y += 0.05;
                    let wh = getWaveHeightAt(whale.mesh.position.x, whale.mesh.position.z, time);
                    if(whale.mesh.position.y > wh - 1) {
                        whale.state = 'surface'; whale.timer = 150; spawnSplash(whale.mesh.position, 3.0);
                        // Spout
                        for(let s=0; s<10; s++) {
                            const splash = new THREE.Mesh(particleGeo.splash, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.6 }));
                            splash.position.copy(whale.mesh.position); splash.position.y += 1; scene.add(splash);
                            activeParticles.push({ mesh: splash, type: 'splash', life: 1.0, decay: 0.02, velocity: new THREE.Vector3((Math.random()-0.5)*0.2, 0.5+Math.random()*0.5, (Math.random()-0.5)*0.2), gravity: 0.02 });
                        }
                    }
                } else if (whale.state === 'surface') {
                    whale.mesh.position.y = getWaveHeightAt(whale.mesh.position.x, whale.mesh.position.z, time) - 1;
                    if(whale.timer <= 0) { whale.state = 'deep'; whale.timer = 600 + Math.random()*400; whale.angle += (Math.random()-0.5)*Math.PI; }
                }

                if(Math.hypot(sx - whale.mesh.position.x, sz - whale.mesh.position.z) > 1200) {
                    scene.remove(whale.mesh); seaCreatures.whales.splice(i, 1); spawnWhale(sx, sz, 1000);
                }
            }

            // Dolphins
            for(let i=seaCreatures.dolphins.length-1; i>=0; i--) {
                let pod = seaCreatures.dolphins[i];
                let distToShip = Math.hypot(sx - pod.dolphins[0].mesh.position.x, sz - pod.dolphins[0].mesh.position.z);
                
                if(distToShip > 1000) {
                    pod.dolphins.forEach(d => scene.remove(d.mesh)); seaCreatures.dolphins.splice(i, 1); spawnDolphinPod(sx, sz, 800); continue;
                }

                // AI logic: follow bow if close, else wander
                if(distToShip < 200 && shipParams.speed > 0.1) {
                    let bowX = sx + Math.cos(shipParams.heading) * 15; let bowZ = sz - Math.sin(shipParams.heading) * 15;
                    pod.target.set(bowX, 0, bowZ);
                } else {
                    if(Math.random() < 0.01) pod.target.set(pod.dolphins[0].mesh.position.x + (Math.random()-0.5)*100, 0, pod.dolphins[0].mesh.position.z + (Math.random()-0.5)*100);
                }

                pod.dolphins.forEach((d, idx) => {
                    let tx = pod.target.x + d.offset.x; let tz = pod.target.z + d.offset.z;
                    let angle = Math.atan2(-(tz - d.mesh.position.z), tx - d.mesh.position.x);
                    d.mesh.rotation.y += (angle - d.mesh.rotation.y) * 0.1;
                    d.mesh.position.x += Math.cos(d.mesh.rotation.y) * pod.speed; d.mesh.position.z -= Math.sin(d.mesh.rotation.y) * pod.speed;
                    
                    let wh = getWaveHeightAt(d.mesh.position.x, d.mesh.position.z, time);
                    d.timer--;
                    
                    if(d.state === 'swim') {
                        d.mesh.position.y = wh - 1.5; d.mesh.rotation.z = 0;
                        if(d.timer <= 0 && Math.random() < 0.1) { d.state = 'jump'; d.vy = 0.5; spawnSplash(d.mesh.position, 0.5); }
                        else if(d.timer <= 0) d.timer = 50 + Math.random()*100;
                    } else if (d.state === 'jump') {
                        d.mesh.position.y += d.vy; d.vy -= 0.02; // gravity
                        d.mesh.rotation.z = Math.atan2(d.vy, pod.speed); // point up/down
                        if(d.mesh.position.y < wh) {
                            d.state = 'swim'; d.timer = 100 + Math.random()*200; d.mesh.position.y = wh - 0.5; spawnSplash(d.mesh.position, 0.8);
                        }
                    }
                });
            }

            // Flying Fish Spawning
            if(shipParams.speed > 0.3 && Math.random() < 0.03 && weather.state !== WEATHER_STATES.STORM) {
                let bowX = sx + Math.cos(shipParams.heading) * 12 + (Math.random()-0.5)*4;
                let bowZ = sz - Math.sin(shipParams.heading) * 12 + (Math.random()-0.5)*4;
                spawnFlyingFish(bowX, bowZ, shipParams.heading); spawnSplash(new THREE.Vector3(bowX, getWaveHeightAt(bowX, bowZ, time), bowZ), 0.3);
            }

            // Flying Fish Update
            for(let i=seaCreatures.flyingFish.length-1; i>=0; i--) {
                let ff = seaCreatures.flyingFish[i];
                ff.mesh.position.x += ff.vx; ff.mesh.position.y += ff.vy; ff.mesh.position.z += ff.vz;
                ff.vy -= 0.01; // low gravity for glide
                ff.mesh.rotation.y = Math.atan2(-ff.vz, ff.vx);
                ff.mesh.rotation.z = Math.atan2(ff.vy, Math.hypot(ff.vx, ff.vz));
                ff.wings[0].rotation.z = Math.sin(time*30)*0.2; ff.wings[1].rotation.z = -Math.sin(time*30)*0.2;

                let wh = getWaveHeightAt(ff.mesh.position.x, ff.mesh.position.z, time);
                if(ff.mesh.position.y < wh) {
                    spawnSplash(ff.mesh.position, 0.3); scene.remove(ff.mesh); seaCreatures.flyingFish.splice(i, 1);
                }
            }

            // Jellyfish
            for(let i=seaCreatures.jellyfish.length-1; i>=0; i--) {
                let jelly = seaCreatures.jellyfish[i];
                jelly.phase += 0.03;
                let wh = getWaveHeightAt(jelly.mesh.position.x, jelly.mesh.position.z, time);
                jelly.mesh.position.y = Math.min(wh - 1, jelly.baseDepth + Math.sin(jelly.phase)*1.5);
                
                // slow drift
                jelly.mesh.position.x += Math.cos(windParams.angle)*0.01; jelly.mesh.position.z -= Math.sin(windParams.angle)*0.01;
                
                let sFactor = Math.sin(jelly.phase)*0.1 + 1;
                jelly.mesh.scale.set(sFactor, 2-sFactor, sFactor);

                if(Math.hypot(sx - jelly.mesh.position.x, sz - jelly.mesh.position.z) > 800) {
                    scene.remove(jelly.mesh); seaCreatures.jellyfish.splice(i, 1); spawnJellyfishLump(sx, sz, 600);
                }
            }

            // Schools of Fish (InstancedMesh)
            for(let i=seaCreatures.schools.length-1; i>=0; i--) {
                let school = seaCreatures.schools[i];
                school.turnTimer--; if(school.turnTimer <= 0) { school.angle += (Math.random()-0.5)*2.0; school.turnTimer = 50 + Math.random()*150; }
                
                school.mesh.position.x += Math.cos(school.angle) * school.speed; school.mesh.position.z -= Math.sin(school.angle) * school.speed;
                
                if(Math.hypot(sx - school.mesh.position.x, sz - school.mesh.position.z) > 800) {
                    scene.remove(school.mesh); seaCreatures.schools.splice(i, 1); spawnFishSchool(sx, sz, 600); continue;
                }

                school.data.forEach((fish, idx) => {
                    fish.phase += 0.1;
                    let ox = fish.offset.x + Math.sin(fish.phase)*0.5; let oy = fish.offset.y + Math.cos(fish.phase*0.8)*0.5; let oz = fish.offset.z + Math.sin(fish.phase*1.2)*0.5;
                    dummy.position.set(ox, oy, oz); dummy.rotation.y = school.angle + Math.sin(fish.phase)*0.2;
                    dummy.updateMatrix(); school.mesh.setMatrixAt(idx, dummy.matrix);
                });
                school.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        function createNavigationGuides() {
            const arrowGroup = new THREE.Group(); const arrowGeo = new THREE.ConeGeometry(1.5, 4, 6); arrowGeo.rotateX(-Math.PI / 2); 
            const arrowMat = new THREE.MeshStandardMaterial({ color: COLORS.accent, emissive: COLORS.accent, emissiveIntensity: 0.5 });
            const arrowMesh = new THREE.Mesh(arrowGeo, arrowMat); arrowGroup.add(arrowMesh); arrowGroup.position.set(0, 22, 0);
            destinationArrow = arrowGroup; destinationArrow.visible = false;

            const beaconGeo = new THREE.CylinderGeometry(4, 4, 150, 16);
            const beaconMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
            destinationBeacon = new THREE.Mesh(beaconGeo, beaconMat); destinationBeacon.position.y = 75; destinationBeacon.visible = false; scene.add(destinationBeacon);
        }

        function createStickFigure() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a679, roughness: 0.8 });
            const clothesColors = [0x475569, 0x1e3a8a, 0x8b5cf6, 0x059669, 0xb45309];
            const shirtColor = clothesColors[Math.floor(Math.random() * clothesColors.length)];
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.9 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), skinMat); head.position.y = 0.65; group.add(head);
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.15), shirtMat); body.position.y = 0.35; group.add(body);

            function createLimb(geo, mat, pivotY, meshY) {
                const pivot = new THREE.Group(); const mesh = new THREE.Mesh(geo, mat); mesh.position.y = meshY; pivot.add(mesh); pivot.position.y = pivotY; return pivot;
            }
            const legGeo = new THREE.BoxGeometry(0.1, 0.25, 0.1);
            const legL = createLimb(legGeo, skinMat, 0.18, -0.1); legL.position.x = -0.08; group.add(legL); const legR = createLimb(legGeo, skinMat, 0.18, -0.1); legR.position.x = 0.08; group.add(legR);
            const armGeo = new THREE.BoxGeometry(0.08, 0.3, 0.08);
            const armL = createLimb(armGeo, skinMat, 0.5, -0.12); armL.position.x = -0.18; group.add(armL); const armR = createLimb(armGeo, skinMat, 0.5, -0.12); armR.position.x = 0.18; group.add(armR);

            group.userData = { legL, legR, armL, armR }; return group;
        }

        function buildShipModel(sailColorHex, addCannons) {
            const shipGroup = new THREE.Group();
            const woodDarkMat = new THREE.MeshStandardMaterial({ color: COLORS.woodDark, roughness: 0.9, metalness: 0.1 });
            const woodLightMat = new THREE.MeshStandardMaterial({ color: COLORS.woodLight, roughness: 0.8, metalness: 0.1 });
            const sailMaterial = new THREE.MeshStandardMaterial({ color: sailColorHex, side: THREE.DoubleSide, roughness: 1.0 });

            const hullGeometry = new THREE.SphereGeometry(2.2, 32, 16); const hull = new THREE.Mesh(hullGeometry, woodLightMat); hull.scale.set(4.8, 1.4, 1.6); 
            const positions = hull.geometry.attributes.position; for (let i = 0; i < positions.count; i++) { if (positions.getY(i) > 0.4) positions.setY(i, 0.4); }
            hull.geometry.computeVertexNormals(); hull.castShadow = true; hull.receiveShadow = true; shipGroup.add(hull);

            const deckGeo = new THREE.PlaneGeometry(16, 4); const deck = new THREE.Mesh(deckGeo, woodDarkMat); deck.rotation.x = -Math.PI/2; deck.position.y = 0.55;
            const deckPos = deck.geometry.attributes.position; for(let i=0; i<deckPos.count; i++) { const x = deckPos.getX(i); deckPos.setZ(i, deckPos.getZ(i) - Math.pow(Math.abs(x)/8, 2)*0.5); }
            deck.geometry.computeVertexNormals(); deck.receiveShadow = true; shipGroup.add(deck);

            const postGeo = new THREE.CylinderGeometry(0.25, 0.15, 4, 8);
            const frontPost = new THREE.Mesh(postGeo, woodDarkMat); frontPost.position.set(9.5, 1.5, 0); frontPost.rotation.z = -Math.PI / 3.2; frontPost.castShadow = true; shipGroup.add(frontPost);
            const backPost = new THREE.Mesh(postGeo, woodDarkMat); backPost.position.set(-9.5, 1.5, 0); backPost.rotation.z = Math.PI / 3.2; backPost.castShadow = true; shipGroup.add(backPost);

            const logGeo = new THREE.CylinderGeometry(0.45, 0.45, 16, 12, 16); logGeo.rotateZ(Math.PI / 2); 
            const outriggerL = new THREE.Mesh(logGeo, woodLightMat); outriggerL.position.set(0, 0.8, -4.5); outriggerL.castShadow = true; shipGroup.add(outriggerL);
            const outriggerR = new THREE.Mesh(logGeo, woodLightMat); outriggerR.position.set(0, 0.8, 4.5); outriggerR.castShadow = true; shipGroup.add(outriggerR);

            const beamGeo = new THREE.CylinderGeometry(0.18, 0.18, 9.5, 8, 12); beamGeo.rotateX(Math.PI / 2);
            const beamPos = beamGeo.attributes.position; for(let i=0; i<beamPos.count; i++) { const bz = beamPos.getZ(i); beamPos.setY(i, beamPos.getY(i) - Math.pow(Math.abs(bz) / 4.75, 2) * 0.8); }
            beamGeo.computeVertexNormals();
            for(let x = -5; x <= 5; x += 5) { const beam = new THREE.Mesh(beamGeo, woodDarkMat); beam.position.set(x, 1.4, 0); beam.castShadow = true; shipGroup.add(beam); }

            const mastGeo = new THREE.CylinderGeometry(0.18, 0.18, 14, 8);
            const mainMast = new THREE.Mesh(mastGeo, woodDarkMat); mainMast.position.set(-1.5, 7, 0); mainMast.castShadow = true; shipGroup.add(mainMast);
            const foreMast = new THREE.Mesh(mastGeo, woodDarkMat); foreMast.position.set(4, 5.5, 0); foreMast.scale.set(1, 0.8, 1); foreMast.castShadow = true; shipGroup.add(foreMast);

            let locWindFlag = null;
            if(addCannons) { 
                locWindFlag = new THREE.Group(); const flagGeo = new THREE.BufferGeometry(); const flagVerts = new Float32Array([ 0, 0, 0, -2, 0.5, 0, -2, -0.5, 0 ]);
                flagGeo.setAttribute('position', new THREE.BufferAttribute(flagVerts, 3)); flagGeo.computeVertexNormals();
                const flagMat = new THREE.MeshStandardMaterial({ color: COLORS.accent, side: THREE.DoubleSide }); const flagMesh = new THREE.Mesh(flagGeo, flagMat); locWindFlag.add(flagMesh);
                locWindFlag.position.set(-1.5, 13.5, 0); shipGroup.add(locWindFlag);
            }

            let locMainSail = new THREE.Group(); locMainSail.position.set(-1.5, 7, 0.2); shipGroup.add(locMainSail);
            let locForeSail = new THREE.Group(); locForeSail.position.set(4, 5, 0.2); shipGroup.add(locForeSail);

            function createSailGroup(width, height) {
                const group = new THREE.Group();
                const sailGeo = new THREE.PlaneGeometry(width, height, 32, 32); sailGeo.translate(0, -height/2, 0); 
                const sailMesh = new THREE.Mesh(sailGeo, sailMaterial); sailMesh.castShadow = true; group.add(sailMesh);
                const yardGeo = new THREE.CylinderGeometry(0.12, 0.12, width + 0.5, 8);
                const topYard = new THREE.Mesh(yardGeo, woodDarkMat); topYard.rotation.z = Math.PI / 2; topYard.position.set(0, 0, 0); group.add(topYard);
                const bottomYard = topYard.clone(); bottomYard.position.set(0, -height, 0); group.add(bottomYard);
                group.sailMesh = sailMesh; group.bottomYard = bottomYard; group.baseHeight = height; return group;
            }

            const mainSailGroup = createSailGroup(9.5, 7.5); mainSailGroup.position.y = 7.5/2; locMainSail.add(mainSailGroup); locMainSail.meshData = mainSailGroup; 
            const foreSailGroup = createSailGroup(7.5, 6); foreSailGroup.position.y = 6/2; locForeSail.add(foreSailGroup); locForeSail.meshData = foreSailGroup;

            let cList = []; let gList = []; let activeDeckhands = [];
            
            if(addCannons) {
                const brassMat = new THREE.MeshStandardMaterial({ color: COLORS.brass, metalness: 0.9, roughness: 0.2 });
                const ironMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.6 });
                const lantakaGeo = new THREE.CylinderGeometry(0.12, 0.22, 1.8, 8); lantakaGeo.rotateX(Math.PI/2); lantakaGeo.translate(0, 0, 0.5); 
                const mountGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
                
                function addCannonLoc(x, y, z, side) {
                    const cannonGroup = new THREE.Group(); cannonGroup.position.set(x, y, z);
                    const mount = new THREE.Mesh(mountGeo, woodDarkMat); mount.position.y = 0.4; cannonGroup.add(mount);
                    const gun = new THREE.Mesh(lantakaGeo, brassMat); gun.position.y = 0.8; gun.rotation.y = side === 'left' ? -Math.PI/2 : Math.PI/2; cannonGroup.add(gun);
                    shipGroup.add(cannonGroup); cList.push({ wrapper: cannonGroup, gun: gun, side: side, baseRot: gun.rotation.y });
                }

                addCannonLoc(-3, 0.7, -2.1, 'left'); addCannonLoc(2, 0.8, -2.1, 'left'); addCannonLoc(7, 0.9, -1.8, 'left');
                addCannonLoc(-3, 0.7, 2.1, 'right'); addCannonLoc(2, 0.8, 2.1, 'right'); addCannonLoc(7, 0.9, 1.8, 'right');

                const bodyGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4); const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                const skinMat = new THREE.MeshStandardMaterial({ color: 0x8d5524, roughness: 0.8 }); const clothesMat = new THREE.MeshStandardMaterial({ color: 0x882222, roughness: 0.9 });
                const arquebusGeo = new THREE.BoxGeometry(0.1, 0.1, 1.2); arquebusGeo.translate(0, 0, 0.4);
                
                function addCrewLoc(x, y, z, side) {
                    const crewGroup = new THREE.Group(); crewGroup.position.set(x, y, z);
                    const body = new THREE.Mesh(bodyGeo, clothesMat); body.position.y = 0.6; crewGroup.add(body);
                    const head = new THREE.Mesh(headGeo, skinMat); head.position.y = 1.4; crewGroup.add(head);
                    const gun = new THREE.Mesh(arquebusGeo, ironMat); gun.position.set(side === 'left'? -0.3 : 0.3, 1.0, 0); gun.rotation.y = side === 'left' ? -Math.PI/2 : Math.PI/2;
                    crewGroup.add(gun); shipGroup.add(crewGroup); gList.push({ wrapper: crewGroup, gun: gun, side: side, baseRot: gun.rotation.y });
                }

                addCrewLoc(-1, 0.6, -1.5, 'left'); addCrewLoc(4.5, 0.7, -1.5, 'left'); addCrewLoc(0, 0.6, 1.5, 'right'); addCrewLoc(5, 0.7, 1.5, 'right');

                for(let i=0; i<6; i++) {
                    const figure = createStickFigure(); const startX = (Math.random() - 0.5) * 10; const startZ = (Math.random() - 0.5) * 3;
                    figure.position.set(startX, 0.55, startZ); shipGroup.add(figure);
                    activeDeckhands.push({ mesh: figure, tx: (Math.random() - 0.5) * 10, tz: (Math.random() - 0.5) * 3, speed: 0.01 + Math.random() * 0.015, phase: Math.random() * Math.PI * 2 });
                }
            }

            shipGroup.position.y = 0.2;
            return { group: shipGroup, mainSail: locMainSail, foreSail: locForeSail, windFlag: locWindFlag, cannons: cList, crewGuns: gList, activeDeckhands: activeDeckhands };
        }

        function createBorobudurShip() {
            shipWrapper = new THREE.Group(); shipWrapper.add(destinationArrow); 
            const model = buildShipModel(COLORS.sail, true);
            ship = model.group; mainSail = model.mainSail; foreSail = model.foreSail; windFlag = model.windFlag;
            cannons = model.cannons; crewGuns = model.crewGuns; deckhands = model.activeDeckhands || []; 
            shipWrapper.add(ship); scene.add(shipWrapper);
        }

        // New voyages begin in the Melaka roadstead — the story's front door.
        // A loaded save overrides this with the ship's last position.
        function spawnOffMelaka() {
            const melaka = docks.find(d => d.name === "Melaka");
            if (!melaka || !shipWrapper) return;
            const isle = islandData[docks.indexOf(melaka)];
            const dx = melaka.x - isle.x, dz = melaka.z - isle.z;
            const d = Math.hypot(dx, dz) || 1;
            shipWrapper.position.set(melaka.x + (dx / d) * 35, 0, melaka.z + (dz / d) * 35);
        }

        function getSafeSpawnPoint() {
            for(let i=0; i<100; i++) {
                let x = (Math.random() - 0.5) * 1600; let z = (Math.random() - 0.5) * 1600; let safe = true;
                for(let island of islandData) { if (Math.hypot(island.x - x, island.z - z) < island.radius + 40) { safe = false; break; } }
                if(safe) return {x, z};
            }
            return {x:0, z:0};
        }
