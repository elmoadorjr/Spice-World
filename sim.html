            for(let i=0; i<6; i++) spawnSingleAI('merchant');
            for(let i=0; i<4; i++) spawnSingleAI('pirate');
        }

        function spawnSingleAI(type) {
            const aiWrapper = new THREE.Group(); let sailColor = type === 'pirate' ? COLORS.pirateSail : COLORS.merchantSail; let hasWeapons = type === 'pirate';
            const model = buildShipModel(sailColor, hasWeapons); aiWrapper.add(model.group);
            let spawnPt = getSafeSpawnPoint(); aiWrapper.position.set(spawnPt.x, 0, spawnPt.z); scene.add(aiWrapper);
            let dockTarget = docks[Math.floor(Math.random() * docks.length)];
            
            aiShips.push({
                type: type, wrapper: aiWrapper, shipMesh: model.group, mainSail: model.mainSail, foreSail: model.foreSail, shipModelData: model, 
                active: true, target: dockTarget, stuckTimer: 0, weaponCooldown: 0, hp: type === 'pirate' ? 400 : 300, maxHp: type === 'pirate' ? 400 : 300,
                params: {
                    speed: 0, maxSpeed: type === 'pirate' ? (0.45 + Math.random()*0.1) : (0.35 + Math.random()*0.15),
                    accel: 0.005, friction: 0.98, heading: Math.random() * Math.PI * 2, turnSpeed: type === 'pirate' ? 0.04 : (0.02 + Math.random()*0.015),
                    sailDeployed: 0, radius: 5
                }
            });
        }
        
        function updateAIShips(time) {
            if(!shipWrapper) return;
            aiShips.forEach(ai => {
                if(!ai.active) return;
                let distToPlayer = Math.hypot(shipWrapper.position.x - ai.wrapper.position.x, shipWrapper.position.z - ai.wrapper.position.z);
                let isPirate = ai.type === 'pirate'; let targetHeading = ai.params.heading; let avoidingObstacle = false;

                let lookAheadX = ai.wrapper.position.x + Math.cos(ai.params.heading) * 45; let lookAheadZ = ai.wrapper.position.z - Math.sin(ai.params.heading) * 45;
                for(let island of islandData) { if (Math.hypot(island.x - lookAheadX, island.z - lookAheadZ) < island.radius + 15) { avoidingObstacle = true; break; } }

                if (avoidingObstacle) { ai.stuckTimer++; targetHeading += Math.PI / 4; ai.params.sailDeployed = Math.max(0, ai.params.sailDeployed - 0.05); } 
                else if (isPirate && distToPlayer < 250) {
                    let dirXP = shipWrapper.position.x - ai.wrapper.position.x; let dirZP = shipWrapper.position.z - ai.wrapper.position.z;
                    let angleToPlayer = Math.atan2(-dirZP, dirXP); ai.stuckTimer = 0;

                    if (distToPlayer > 80) { targetHeading = angleToPlayer; } 
                    else {
                        let relP = angleToPlayer - ai.params.heading; while(relP > Math.PI) relP -= Math.PI * 2; while(relP < -Math.PI) relP += Math.PI * 2;
                        if (relP > 0) targetHeading = angleToPlayer - Math.PI/2; else targetHeading = angleToPlayer + Math.PI/2; 
                    }

                    if (ai.weaponCooldown <= 0 && distToPlayer < 90) {
                        let relAim = angleToPlayer - ai.params.heading; while(relAim > Math.PI) relAim -= Math.PI * 2; while(relAim < -Math.PI) relAim += Math.PI * 2;
                        if (Math.abs(relAim) > Math.PI/4 && Math.abs(relAim) < 3*Math.PI/4) {
                            let sideToFire = relAim > 0 ? 'left' : 'right'; aiFireWeapons(ai, shipWrapper.position, sideToFire); ai.weaponCooldown = 150 + Math.random() * 100;
                        }
                    }
                } 
                else {
                    let dirX = ai.target.x - ai.wrapper.position.x; let dirZ = ai.target.z - ai.wrapper.position.z; let distToTarget = Math.hypot(dirX, dirZ);
                    if (distToTarget < 30 || ai.stuckTimer > 300) {
                        let validDocks = docks.filter(d => d !== ai.target); if(validDocks.length > 0) ai.target = validDocks[Math.floor(Math.random() * validDocks.length)]; ai.stuckTimer = 0;
                    }
                    targetHeading = Math.atan2(-dirZ, dirX);
                }

                if(ai.weaponCooldown > 0) ai.weaponCooldown--;
                let turnAmt = targetHeading - ai.params.heading; while(turnAmt > Math.PI) turnAmt -= Math.PI * 2; while(turnAmt < -Math.PI) turnAmt += Math.PI * 2;
                if (Math.abs(turnAmt) > 0.05) { ai.params.heading += Math.sign(turnAmt) * ai.params.turnSpeed; }
                ai.wrapper.rotation.y = ai.params.heading;

                let relativeWind = windParams.angle - ai.params.heading; while(relativeWind > Math.PI) relativeWind -= Math.PI * 2; while(relativeWind < -Math.PI) relativeWind += Math.PI * 2;
                let isPortWind = relativeWind > 0; let windAngleDeg = Math.abs(relativeWind * (180 / Math.PI));
                let windEfficiency = (windAngleDeg <= 35) ? -0.05 : (windAngleDeg <= 90) ? 0.15 + 0.85 * ((windAngleDeg - 35) / 55) : 1.0;
                let targetDist = isPirate && distToPlayer < 250 ? distToPlayer : Math.hypot(ai.target.x - ai.wrapper.position.x, ai.target.z - ai.wrapper.position.z);

                if(!avoidingObstacle && targetDist > (isPirate ? 40 : 30) && windEfficiency > 0) { ai.params.sailDeployed = Math.min(1.0, ai.params.sailDeployed + 0.01); } 
                else { ai.params.sailDeployed = Math.max(0.0, ai.params.sailDeployed - 0.02); }

                let targetSailAngle = 0; if (windAngleDeg > 35) { targetSailAngle = ((windAngleDeg - 35) / 145) * 1.5; } if (isPortWind) targetSailAngle = -targetSailAngle;
                ai.mainSail.rotation.y += (targetSailAngle - ai.mainSail.rotation.y) * 0.1; ai.foreSail.rotation.y += (targetSailAngle - ai.foreSail.rotation.y) * 0.1;
                
                [ai.mainSail, ai.foreSail].forEach(sailWrapper => {
                    if(!sailWrapper.meshData) return;
                    const meshData = sailWrapper.meshData; const sailMesh = meshData.sailMesh; const bottomYard = meshData.bottomYard; const baseHeight = meshData.baseHeight;
                    const deployRatio = Math.max(0.05, ai.params.sailDeployed); sailMesh.scale.y = deployRatio; bottomYard.position.y = -baseHeight * deployRatio;
                    let windImpact = Math.abs(windEfficiency * ai.params.sailDeployed) * 2.0; const pos = sailMesh.geometry.attributes.position;
                    for(let i=0; i<pos.count; i++) {
                        const x = pos.getX(i); const y = pos.getY(i); const w = sailMesh.geometry.parameters.width; const h = sailMesh.geometry.parameters.height;
                        let billowDepth = windImpact; if(windAngleDeg <= 35 || ai.params.sailDeployed < 0.2) billowDepth = Math.sin(time * 25 + y * 4) * 0.25;
                        const normalizedX = (x / w) + 0.5; const normalizedY = (y / -h); const billow = Math.sin(normalizedX * Math.PI) * Math.sin(normalizedY * Math.PI) * billowDepth;
                        let dir = isPortWind ? -1 : 1; if(windAngleDeg <= 35) dir = Math.sin(time*12) > 0 ? 1 : -1; pos.setZ(i, dir * billow);
                    }
                    sailMesh.geometry.attributes.position.needsUpdate = true; sailMesh.geometry.computeVertexNormals();
                });

                let forwardDrive = windEfficiency * ai.params.sailDeployed; ai.params.speed += forwardDrive * ai.params.accel; ai.params.speed *= ai.params.friction;
                ai.params.speed = Math.max(-ai.params.maxSpeed * 0.2, Math.min(ai.params.maxSpeed, ai.params.speed));
                ai.wrapper.position.x += Math.cos(ai.params.heading) * ai.params.speed; ai.wrapper.position.z -= Math.sin(ai.params.heading) * ai.params.speed;

                let waveHeight = getWaveHeightAt(ai.wrapper.position.x, ai.wrapper.position.z, time); ai.shipMesh.position.y = waveHeight + 0.2;
                
                let probeDist = 4.0;
                let hwFront = getWaveHeightAt(ai.wrapper.position.x + Math.cos(ai.params.heading)*probeDist, ai.wrapper.position.z - Math.sin(ai.params.heading)*probeDist, time);
                let hwBack = getWaveHeightAt(ai.wrapper.position.x - Math.cos(ai.params.heading)*probeDist, ai.wrapper.position.z + Math.sin(ai.params.heading)*probeDist, time);
                let hwRight = getWaveHeightAt(ai.wrapper.position.x + Math.sin(ai.params.heading)*probeDist, ai.wrapper.position.z + Math.cos(ai.params.heading)*probeDist, time);
                let hwLeft = getWaveHeightAt(ai.wrapper.position.x - Math.sin(ai.params.heading)*probeDist, ai.wrapper.position.z - Math.cos(ai.params.heading)*probeDist, time);
                
                let targetPitch = Math.atan2(hwFront - hwBack, probeDist * 2); let targetRoll = Math.atan2(hwLeft - hwRight, probeDist * 2);
                ai.shipMesh.rotation.x += (targetPitch - ai.shipMesh.rotation.x) * 0.2; ai.shipMesh.rotation.z += (targetRoll - ai.shipMesh.rotation.z) * 0.2;
                
                if(Math.abs(ai.params.speed) > 0.1 && Math.random() > 0.5) spawnWakeParticle(ai.wrapper.position.x - Math.cos(ai.params.heading)*8, ai.wrapper.position.z + Math.sin(ai.params.heading)*8, Math.abs(ai.params.speed));
            });
        }

        function aiFireWeapons(ai, targetPos, side) {
            if(!ai.shipModelData || !ai.shipModelData.cannons) return;
            let sideCannons = ai.shipModelData.cannons.filter(c => c.side === side); let cannonsFired = 0; const projectileSpeed = 2.5;
            sideCannons.forEach((c) => {
                setTimeout(() => {
                    let aimPos = targetPos.clone(); aimPos.x += (Math.random() - 0.5) * 15; aimPos.z += (Math.random() - 0.5) * 15;
                    shootProjectile(c.gun, ai.wrapper, aimPos, projectileSpeed, 0.3, true, CANNON_DAMAGE * 0.8, true); 
                }, cannonsFired * 120 + Math.random()*80);
                cannonsFired++;
            });
        }

        function fireWeapons() {
            if (weaponCooldown > 0) { showFloatingText("RELOADING!", shipWrapper.position.x, shipWrapper.position.y + 15, "text-rose-500"); return; }

            const dx = aimTarget3D.x - shipWrapper.position.x; const dz = aimTarget3D.z - shipWrapper.position.z; const angleToTarget = Math.atan2(-dz, dx);
            let relAngle = angleToTarget - shipParams.heading; while(relAngle > Math.PI) relAngle -= Math.PI * 2; while(relAngle < -Math.PI) relAngle += Math.PI * 2;
            
            const targetSide = relAngle > 0 ? 'left' : 'right';
            let sideCannons = cannons.filter(c => c.side === targetSide); let sideGuns = crewGuns.filter(c => c.side === targetSide);
            let totalMpCost = (sideCannons.length * CANNON_MP_COST) + (sideGuns.length * GUN_MP_COST);
            
            if (shipParams.mp < totalMpCost) { showFloatingText("NOT ENOUGH MP", shipWrapper.position.x, shipWrapper.position.y + 15, "text-blue-400"); return; }
            shipParams.mp -= totalMpCost; updateVitalsUI(); 

            let cannonsFired = 0; const projectileSpeed = 2.5;
            sideCannons.forEach((c) => { setTimeout(() => { shootProjectile(c.gun, c.wrapper, aimTarget3D, projectileSpeed, 0.3, true, playerCannonDamage(), false); }, cannonsFired * 100 + Math.random()*50); cannonsFired++; });
            sideGuns.forEach((c) => { setTimeout(() => { shootProjectile(c.gun, c.wrapper, aimTarget3D, projectileSpeed * 1.5, 0.15, false, playerGunDamage(), false); }, cannonsFired * 80 + Math.random()*100); });

            if (cannonsFired > 0) {
                weaponCooldown = 180; cameraShake = 0.5; updateWeaponUI(); shipParams.speed -= (shipParams.speed > 0 ? 0.05 : 0.02);
                showFloatingText(`${targetSide.toUpperCase()} SIDE FIRED`, shipWrapper.position.x, shipWrapper.position.y + 20, "text-amber-400");
            } else { showFloatingText("NO ANGLE", shipWrapper.position.x, shipWrapper.position.y + 10, "text-rose-500"); }
        }

        function shootProjectile(gunMesh, wrapperGroup, targetPos, speed, size, isCannon, damageVal, isEnemy = false) {
            const muzzlePos = new THREE.Vector3(0, 0, isCannon ? 1.4 : 0.6); muzzlePos.applyMatrix4(gunMesh.matrixWorld);
            const distSq = muzzlePos.distanceToSquared(targetPos); const spread = Math.sqrt(distSq) * (isEnemy ? 0.04 : 0.02); 
            const finalTarget = targetPos.clone(); finalTarget.x += (Math.random()-0.5) * spread; finalTarget.z += (Math.random()-0.5) * spread;

            const dx = finalTarget.x - muzzlePos.x; const dz = finalTarget.z - muzzlePos.z; const distXZ = Math.sqrt(dx*dx + dz*dz);
            const timeToTarget = distXZ / speed; const gravity = 0.05; const vy = (0 - muzzlePos.y + 0.5 * gravity * timeToTarget * timeToTarget) / timeToTarget;
            const velocity = new THREE.Vector3(dx / timeToTarget, vy, dz / timeToTarget);

            const geo = new THREE.SphereGeometry(size, 8, 8); const mat = new THREE.MeshStandardMaterial({ color: isCannon ? 0x111111 : 0x888888, roughness: isCannon ? 0.6 : 0.2, metalness: isCannon ? 0.8 : 1.0 });
            const proj = new THREE.Mesh(geo, mat); proj.position.copy(muzzlePos); scene.add(proj);
            activeProjectiles.push({ mesh: proj, velocity: velocity, gravity: gravity, isCannon: isCannon, damage: damageVal, isEnemy: isEnemy });
            createMuzzleEffect(muzzlePos, isCannon); 
        }

        function createWorld() {
            const islandGeo = new THREE.CylinderGeometry(15, 18, 2, 16); const hillGeo = new THREE.SphereGeometry(9, 9, 8);

            const plankGeo = new THREE.BoxGeometry(3, 0.6, 16); const postGeo = new THREE.CylinderGeometry(0.4, 0.4, 6, 8);
            const houseWallGeo = new THREE.BoxGeometry(4, 3, 4); const houseRoofGeo = new THREE.ConeGeometry(3.5, 3, 4); houseRoofGeo.rotateY(Math.PI / 4);
            const crateGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            
            const sandMat = new THREE.MeshStandardMaterial({ color: COLORS.sand, roughness: 1.0, flatShading: true });
            const grassMat = new THREE.MeshStandardMaterial({ color: COLORS.grass, roughness: 0.9, flatShading: true });
            const woodMat = new THREE.MeshStandardMaterial({ color: COLORS.woodDark, flatShading: true });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d7a33, flatShading: true });
            const thatchMat = new THREE.MeshStandardMaterial({ color: 0xa68a61, roughness: 1.0 });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0xd97736, roughness: 0.8 });

            // Fixed geography: islands sit where the real ports sit (see
            // js/data/ports.js), so Melaka truly guards the strait and the
            // Maluku spice islands truly are the far east of the world.
            const spawnPoints = computeWorldLayout();

            spawnPoints.forEach((point, portIdx) => {
                const island = new THREE.Group();
                const beach = new THREE.Mesh(islandGeo, sandMat); beach.position.y = -0.5; beach.receiveShadow = true; island.add(beach);
                const numHills = 1 + Math.floor(Math.random()*3);
                for(let h=0; h<numHills; h++) {
                    const hill = new THREE.Mesh(hillGeo, grassMat); hill.position.set((Math.random()-0.5)*9, 1.0, (Math.random()-0.5)*9); hill.scale.set(1, 0.4 + Math.random() * 0.5, 1); hill.castShadow = true; hill.receiveShadow = true; island.add(hill);
                }

                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(trunkGeo, woodMat); trunk.position.y = 3; trunk.castShadow = true; const leaves = new THREE.Mesh(leavesGeo, leafMat); leaves.position.y = 6.5; leaves.castShadow = true;
                    tree.add(trunk); tree.add(leaves); const treeAngle = Math.random() * Math.PI * 2; const treeRadius = Math.random() * 11; 
                    tree.position.set(Math.cos(treeAngle) * treeRadius, 1.5, Math.sin(treeAngle) * treeRadius); tree.scale.setScalar(0.7 + Math.random() * 0.6); tree.rotation.x = (Math.random()-0.5)*0.2; tree.rotation.z = (Math.random()-0.5)*0.2; island.add(tree);
                }

                { // every island is a real port with a dock

                    for(let p = 0; p < 4; p++) { const post = new THREE.Mesh(postGeo, woodMat); post.position.set(p%2===0 ? -1.2 : 1.2, 0.5, 3 + Math.floor(p/2) * 10); dockGroup.add(post); }
                    const numHouses = Math.floor(Math.random() * 3) + 1;

                        house.add(walls); house.add(roof); house.position.set((Math.random()-0.5)*10, 0, -4 - Math.random()*5); house.rotation.y = Math.random() * Math.PI; dockGroup.add(house);
                    }

                    const goodsGroup = new THREE.Group();

                    const goldCrate = new THREE.Mesh(crateGeo, goldMat); goldCrate.position.set(0, 2.5, 0); goldCrate.rotation.y = Math.PI/4; goldCrate.castShadow = true; goodsGroup.add(goldCrate);

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime(); const delta = clock.getDelta() || 0.016;
            
            updateEnvironment(delta); handleWeatherState(delta);
            nakhodaFrame();

            if (water) {
                if (water.material.userData.time) water.material.userData.time.value = t;
                if (water.material.normalMap) { water.material.normalMap.offset.x += delta * 0.035; water.material.normalMap.offset.y += delta * 0.025; }
            }

            clouds.forEach((c, i) => { 
                c.mesh.position.x += 0.05 + (weather.waveMultiplier * 0.1); if(c.mesh.position.x > 1800) c.mesh.position.x = -1800; 
                if (weather.state === WEATHER_STATES.STORM) c.mesh.children.forEach(child => child.material.opacity = c.baseOpacity);
                else if (weather.state === WEATHER_STATES.FOG) c.mesh.children.forEach(child => child.material.opacity = c.baseOpacity * 0.2);
                else c.mesh.children.forEach(child => child.material.opacity = c.baseOpacity);
            });

            birds.forEach(b => {
                const flap = Math.sin(t * b.flapSpeed + b.flapOffset) * 0.6; b.wingL.rotation.z = flap; b.wingR.rotation.z = -flap; b.angle += b.speed * b.dir;

        function tryEnterPort(dock){

            keys.w = keys.a = keys.s = keys.d = false;

            game.known[dock.name] = {

            };
            openPortPanel(dock);

        function leavePort(){
            if (!portOpen) return;
            // Nudge the ship away from the dock so it doesn't re-collide
            const dock = portOpen; portOpen = null;
            const dx = shipWrapper.position.x - dock.x; const dz = shipWrapper.position.z - dock.z;
            const d = Math.hypot(dx, dz) || 1;
            shipWrapper.position.x += (dx/d) * 6; shipWrapper.position.z += (dz/d) * 6;
            closePortPanel();
            saveGame();
        }

        function updateMinimap() {
            if (!shipWrapper) return;
            const canvas = document.getElementById('minimap'); if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height; const cx = w / 2; const cy = h / 2; const scale = canvas.width > 120 ? 0.2 : 0.3; 

            let mapBaseColor = '#0f172a';
            if (weather.state === WEATHER_STATES.STORM) mapBaseColor = '#111827';
            else if (weather.state === WEATHER_STATES.FOG) mapBaseColor = '#475569';
            else { let sunAlt = Math.sin((timeOfDay.cycle * Math.PI * 2) - (Math.PI / 2)); if(sunAlt < 0) mapBaseColor = '#020617'; }
            ctx.fillStyle = mapBaseColor; ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.beginPath();
            ctx.arc(cx, cy, cx*0.5, 0, Math.PI*2); ctx.arc(cx, cy, cx*0.9, 0, Math.PI*2); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

            const shipX = shipWrapper.position.x; const shipZ = shipWrapper.position.z;
            
            let visibilityRange = w;
            if(weather.state === WEATHER_STATES.FOG) visibilityRange = (w/2) * 0.4;
            else { let sunAlt = Math.sin((timeOfDay.cycle * Math.PI * 2) - (Math.PI / 2)); if(sunAlt < 0) visibilityRange = (w/2) * 0.7; }

            islandData.forEach(island => {
                const mapX = cx + (island.x - shipX) * scale; const mapY = cy + (island.z - shipZ) * scale; const distToCenter = Math.hypot(mapX-cx, mapY-cy);
                if (mapX > -50 && mapX < w + 50 && mapY > -50 && mapY < h + 50 && distToCenter < visibilityRange) { ctx.beginPath(); ctx.arc(mapX, mapY, island.radius * scale, 0, Math.PI * 2); ctx.fillStyle = '#9ca3af'; ctx.fill(); }
            });

            docks.forEach(dock => {
                const mapX = cx + (dock.x - shipX) * scale; const mapY = cy + (dock.z - shipZ) * scale; const distToCenter = Math.hypot(mapX-cx, mapY-cy);
                if (mapX > -20 && mapX < w + 20 && mapY > -20 && mapY < h + 20 && distToCenter < visibilityRange) {
                    ctx.beginPath();
                    if (dock === currentDestination) { ctx.arc(mapX, mapY, 6 + Math.sin(Date.now() * 0.005)*2, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.shadowBlur = 10; ctx.shadowColor = '#10b981'; } 
                    else if (dock.goodsGroup && dock.goodsGroup.visible) { ctx.arc(mapX, mapY, 5, 0, Math.PI * 2); ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 8; ctx.shadowColor = '#fbbf24'; } 
                    else { ctx.arc(mapX, mapY, 3, 0, Math.PI * 2); ctx.fillStyle = '#475569'; ctx.shadowBlur = 0; }
                    ctx.fill(); ctx.shadowBlur = 0; 
                }
            });
            
            aiShips.forEach(ai => {
                if(!ai.active) return;
                const mapX = cx + (ai.wrapper.position.x - shipX) * scale; const mapY = cy + (ai.wrapper.position.z - shipZ) * scale; const distToCenter = Math.hypot(mapX-cx, mapY-cy);
                if (mapX > -20 && mapX < w + 20 && mapY > -20 && mapY < h + 20 && distToCenter < visibilityRange) {
                    ctx.beginPath(); const r = ai.type === 'pirate' ? 4 : 3; ctx.arc(mapX, mapY, r, 0, Math.PI * 2);  ctx.fillStyle = ai.type === 'pirate' ? '#ef4444' : '#3b82f6';
                    if (ai.type === 'pirate') { ctx.shadowBlur = 5; ctx.shadowColor = '#ef4444'; } ctx.fill(); ctx.shadowBlur = 0;
                }
            });

            ctx.strokeStyle = 'rgba(34,211,238,0.4)'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(windParams.angle)*40, cy - Math.sin(windParams.angle)*40); ctx.stroke();

            ctx.save(); ctx.translate(cx, cy); ctx.rotate(-shipParams.heading); ctx.beginPath();
            ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-4, 0); ctx.lineTo(-6, -6); ctx.closePath();
            ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 5; ctx.shadowColor = 'white'; ctx.fill(); ctx.restore();
            
            if(visibilityRange < w) {
                const grd = ctx.createRadialGradient(cx, cy, visibilityRange * 0.5, cx, cy, w); grd.addColorStop(0, "rgba(15, 23, 42, 0)"); grd.addColorStop(1, mapBaseColor);
                ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, w, 0, Math.PI*2); ctx.fill();
            }
        }

        window.onload = init;
    </script>
</body>
