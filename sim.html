<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nakhoda: The Spice Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/voyage.css">
</head>
<body>

<div id="loading"><div class="t">Nakhoda</div><div class="s" id="loading-step">Charting the coasts</div></div>
<div id="game"></div>

<div id="hud" class="hidden">
  <div class="hud-tl panel">
    <div class="purse"><i class="coin"></i><b id="h-gold">0</b><span>pisis</span></div>
    <div class="hud-line rank" id="h-rank"></div>
    <div class="hud-line" id="h-date"></div>
    <div class="hud-line season" id="h-season"></div>
  </div>

  <div class="hud-compass panel"><div class="strip" id="h-strip"></div><div class="center"></div></div>

  <div class="hud-tr">
    <canvas id="h-mini" width="336" height="336" title="Open the chart (M)"></canvas>
    <button class="chip-btn" id="b-chart">Chart</button>
  </div>
  <div id="fair">Fair winds · ×3</div>

  <div class="hud-bl panel">
    <div class="gauge-row"><span>Hull</span><b id="h-hp"></b></div>
    <div class="bar" id="h-hpbar"><i></i></div>
    <div class="helm">
      <canvas id="h-dial" width="128" height="128"></canvas>
      <div>
        <div class="speed"><span id="h-speed">0.0</span><small>KNOTS</small></div>
        <div class="pos" id="h-pos">In irons</div>
        <div class="sail-pips" id="h-sail"><i></i><i></i><span>Furled</span></div>
      </div>
    </div>
    <div class="hold-line"><div id="h-hold"></div><div class="charter" id="h-charter"></div></div>
    <div class="guns">
      <div>Port guns <span class="k">Q</span><div class="bar"><i id="h-rl"></i></div></div>
      <div>Starboard guns <span class="k">E</span><div class="bar"><i id="h-rr"></i></div></div>
    </div>
  </div>

  <div class="hud-br panel">
    <div><kbd>A</kbd><kbd>D</kbd> steer &nbsp; <kbd>W</kbd><kbd>S</kbd> sails</div>
    <div><kbd>Q</kbd><kbd>E</kbd> broadsides &nbsp; <kbd>F</kbd> dock</div>
    <div><kbd>M</kbd> chart &nbsp; <kbd>R</kbd> pilot &nbsp; <kbd>T</kbd> fair winds</div>
    <div>Drag to look · scroll to zoom · <kbd>Esc</kbd></div>
  </div>

  <div id="h-prompt"><button id="h-prompt-btn"></button></div>
  <div id="toasts"></div>
  <div id="banner"><div class="t"></div><div class="s"></div><div class="rule"></div></div>
  <div id="labels"></div>
  <div id="floaters"></div>

  <div id="touch">
    <button class="tc" id="tc-left">◀</button><button class="tc" id="tc-right">▶</button>
    <button class="tc" id="tc-up"><small>SAIL</small>▲</button><button class="tc" id="tc-down"><small>SAIL</small>▼</button>
    <button class="tc" id="tc-fl"><small>FIRE</small>◀</button><button class="tc" id="tc-fr"><small>FIRE</small>▶</button>
  </div>
</div>

<div id="modal"></div>
<div id="title" style="display:none"></div>

<script src="vendor/three.min.js"></script>
<script src="js/data/ports.js"></script>
<script src="js/data/factions.js"></script>
<script src="js/data/coastlines.js"></script>
<script src="js/voyage/00-core.js"></script>
<script src="js/voyage/01-world.js"></script>
<script src="js/voyage/02-sky.js"></script>
<script src="js/voyage/03-water.js"></script>
<script src="js/voyage/04-land.js"></script>
<script src="js/voyage/05-towns.js"></script>
<script src="js/voyage/06-ships.js"></script>
<script src="js/voyage/07-economy.js"></script>
<script src="js/voyage/08-game.js"></script>
<script src="js/voyage/09-player.js"></script>
<script src="js/voyage/10-fleet.js"></script>
<script src="js/voyage/11-audio.js"></script>
<script src="js/voyage/12-chart.js"></script>
<script src="js/voyage/13-hud.js"></script>
<script src="js/voyage/14-port.js"></script>
<script src="js/voyage/15-main.js"></script>
</body>
</html>
